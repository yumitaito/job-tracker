name: CI
permissions:
  contents: read
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:security
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  backend-security:
    name: Backend Security Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.39.2
      - name: Bootstrap local DB and replay migrations
        run: npm run setup:db:security
      - name: Export local API key
        run: echo "LOCAL_ANON_KEY=$(supabase status -o json | jq -r .ANON_KEY)" >> "$GITHUB_ENV"
      - name: Run DB security integration tests
        run: npm run test:db
      - name: Install authenticated E2E browser
        run: npx playwright install --with-deps chromium
      - name: Create local authenticated E2E user
        run: |
          curl --fail --silent --show-error \
            -H "apikey: $LOCAL_ANON_KEY" -H "Content-Type: application/json" \
            -d '{"email":"e2e@example.test","password":"Local-e2e-password-123"}' \
            http://127.0.0.1:54321/auth/v1/signup
      - name: Run authenticated E2E against local Supabase
        run: npm run test:e2e -- e2e/smoke/authenticated.spec.ts
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ${{ env.LOCAL_ANON_KEY }}
          E2E_TEST_USER_EMAIL: e2e@example.test
          E2E_TEST_USER_PASSWORD: Local-e2e-password-123
          E2E_REQUIRE_AUTH: "true"
      - name: Collect Supabase logs
        if: failure()
        run: |
          supabase status > supabase-failure.log 2>&1 || true
          docker ps -a >> supabase-failure.log 2>&1 || true
          docker ps -a --filter "name=supabase_" --format '{{.Names}}' | while read -r container; do
            echo "===== $container =====" >> supabase-failure.log
            docker logs "$container" >> supabase-failure.log 2>&1 || true
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: supabase-failure-logs
          path: supabase-failure.log
          retention-days: 7
          if-no-files-found: ignore
      - if: always()
        run: supabase stop --no-backup

  edge-security:
    name: Edge Function Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with: { deno-version: v2.5.4 }
      - run: npm run test:edge

  public-e2e:
    name: Public E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run public routes only
        run: npm run test:e2e -- e2e/smoke/unauthenticated.spec.ts
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: public-playwright-report, path: playwright-report/, retention-days: 7 }
